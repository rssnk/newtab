<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>new tab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #vanta-background { width: 100vw; height: 100vh; position: relative; }
  </style>
</head>
<body>

  <div id="vanta-background"></div>

  <script src="js/three.min.js"></script>
  <script src="js/vanta.net.min.js"></script>
  <script>
    VANTA.NET({
      el: "#vanta-background",
      mouseControls: false,
      touchControls: false,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 0.95,
      scaleMobile: 1.00,
      backgroundColor: 0x0
    })
  </script>

</body>
</html>
